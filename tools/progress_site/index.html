<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB The Show · recomp recovery map</title>
<style>
:root{color-scheme:dark;--bg:#0d1015;--text:#e8edf0;--muted:#b5bdc3;--line:#151b22;--green:#28a745;--green2:#39b755;--gray:#69737d;--gray2:#87919a;--amber:#d69b25;--panel:#11161c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.25 Arial,Helvetica,sans-serif}main{width:min(100%,1030px);margin:0 auto;padding:10px 4px 30px}h1,h2,h3,p{margin:0;font-size:inherit;font-weight:400}h1{font-size:17px;margin-bottom:14px}h2{font-size:16px;margin:12px 0 6px}h3{font-size:14px;margin-bottom:4px}.sub{color:var(--muted)}.mono{font-family:Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:10px 0 14px}.metric{padding:6px;background:#11161c;min-height:54px}.metric .value{font-size:18px;font-weight:500;color:#f5f7f8}.metric .label{color:var(--muted);font-size:12px;margin-top:3px}.module-heads,.modules{display:grid;grid-template-columns:minmax(0,94991fr) minmax(0,40069fr);gap:5px}.module-head{display:flex;justify-content:space-between;gap:6px;margin:4px 0}.module-head strong{font-weight:400}.module-canvas{display:block;width:100%;height:auto;background:#151b22;image-rendering:pixelated}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:7px 0 14px}.key{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}.green{background:var(--green2)}.green-dark{background:#197b36}.gray{background:var(--gray)}.map-info{min-height:18px;color:var(--muted);font:12px Consolas,"Courier New",monospace}.panel{margin-top:17px}.panel-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel-head .sub{font-size:12px}.treemap{width:100%;height:300px;display:block;background:#11161c}.treemap.structure-map{height:410px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:18px}.barlist{display:grid;gap:8px;margin-top:10px}.barrow{display:grid;grid-template-columns:minmax(120px,1fr) 3fr minmax(78px,.55fr);gap:8px;align-items:center}.bartrack{height:15px;background:var(--gray)}.barfill{height:100%;background:var(--green)}.barfill.medium{background:var(--gray2)}.barfill.low{background:var(--amber)}.right{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.foot{color:var(--muted);font-size:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:8px}.error{color:#ffc1b8;padding:12px;background:#301b1b}
@media(max-width:640px){body{font-size:14px}main{padding:12px 10px 24px}.head{align-items:flex-start;gap:6px;flex-direction:column}h1{font-size:16px;margin-bottom:0}.head .sub{font-size:12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.metric{min-width:0;min-height:62px;padding:8px}.metric .value{font-size:17px;overflow-wrap:anywhere}.metric .label{font-size:11px;line-height:1.3}.module-heads,.modules{grid-template-columns:1fr}.module-heads .module-head:nth-child(2){margin-top:12px}.module-head{margin:6px 0}.modules{gap:8px}.module-canvas{touch-action:pan-y}.map-info{font-size:11px;overflow-wrap:anywhere;min-height:30px}.legend{gap:8px 14px;line-height:1.5}.lower{grid-template-columns:1fr;gap:4px}.treemap{height:260px}.treemap.structure-map{height:320px}.barrow{grid-template-columns:minmax(105px,1.15fr) minmax(55px,1.5fr) minmax(58px,.55fr);gap:6px;font-size:12px}.bartrack{height:12px}.panel-head{align-items:flex-start;flex-direction:column;gap:6px}.panel-head>div{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;flex-wrap:wrap}.timeline-filter{min-height:40px;max-width:100%}.timeline{max-height:50vh}.timeline-row{grid-template-columns:1fr;gap:5px;padding:10px}.timeline-time{white-space:normal}.timeline-details{-webkit-line-clamp:3}.foot{line-height:1.45}}
.timeline{display:grid;gap:1px;margin-top:10px;background:var(--line);max-height:540px;overflow:auto}.timeline-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px;background:var(--panel)}.timeline-time{font:12px Consolas,"Courier New",monospace;color:var(--muted);white-space:nowrap}.timeline-title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.timeline-title strong{font-weight:500;overflow-wrap:anywhere}.timeline-kind{font-size:11px;color:#a9e6b7;border:1px solid #285b37;padding:1px 5px}.timeline-action{font-size:11px;color:var(--muted);text-transform:uppercase}.timeline-details{margin-top:4px;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.timeline-meta{margin-top:4px;color:#81909b;font:11px Consolas,"Courier New",monospace}.timeline-empty{padding:14px;color:var(--muted);background:var(--panel)}.timeline-filter{background:#11161c;color:var(--text);border:1px solid #343c44;padding:5px 8px;font:12px Arial,Helvetica,sans-serif}
@media(max-width:640px){.timeline-row{grid-template-columns:1fr;gap:5px;padding:9px}.timeline-time{white-space:normal}}
</style>
</head>
<body>
<main>
  <div class="head"><h1>MLB THE SHOW · RECOMP RECOVERY MAP</h1><div id="topline" class="sub">Loading current annotation indexes…</div></div>
  <div id="app"><div class="sub">Reading the recomp function, prototype, and field indexes.</div></div>
</main>
<script>
const COLORS={unknown:"#69737d",symbol:"#197b36",semantic:"#39b755",high:"#39b755",medium:"#69737d",low:"#d69b25",text:"#f0f3f5",muted:"#c0c7cc",line:"#11161c"};
const fmt=n=>Number(n).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function percent(a,b){return b?(100*a/b).toFixed(2):"0.00"}
function drawModule(canvas,module,semanticNames,info){
  const cssW=Math.max(150,canvas.getBoundingClientRect().width), dpr=window.devicePixelRatio||1, cell=1.6;
  const cols=Math.max(1,Math.floor(cssW/cell)), rows=Math.ceil(module.addresses.length/cols), cssH=rows*cell;
  canvas.style.height=cssH+"px";canvas.width=Math.ceil(cssW*dpr);canvas.height=Math.ceil(cssH*dpr);
  const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#151b22";ctx.fillRect(0,0,cssW,cssH);
  const states=Uint8Array.from(atob(module.stateMap),c=>c.charCodeAt(0));
  const colors=[COLORS.unknown,COLORS.symbol,COLORS.semantic];
  for(let i=0;i<states.length;i++){ctx.fillStyle=colors[states[i]];ctx.fillRect((i%cols)*cell,Math.floor(i/cols)*cell,cell-.55,cell-.55)}
  canvas.dataset.cols=cols;canvas.dataset.cell=cell;canvas.dataset.module=module.name;
  const inspectPoint=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*cssW/r.width,y=(e.clientY-r.top)*cssH/r.height;const i=Math.floor(y/cell)*cols+Math.floor(x/cell);if(i>=module.addresses.length){info.textContent="";return}const state=states[i],addr=module.addresses[i],label=state===2?(semanticNames[addr]||"semantic annotation"):state===1?"exact exported symbol":"address-only internal";info.textContent=module.name+" · "+addr+" · "+label};
  canvas.onpointermove=e=>{if(e.pointerType!=="touch")inspectPoint(e)};
  canvas.onpointerdown=inspectPoint;
  canvas.onpointerleave=e=>{if(e.pointerType!=="touch")info.textContent="Tap or hover the function map to inspect an indexed address and naming evidence."};
}
function worst(row,side){let sum=row.reduce((a,x)=>a+x.area,0),max=Math.max(...row.map(x=>x.area)),min=Math.min(...row.map(x=>x.area));return Math.max(side*side*max/(sum*sum),sum*sum/(side*side*min))}
function squarify(items,W,H){let list=items.map(x=>({...x,area:Math.max(.01,x.total)})).sort((a,b)=>b.area-a.area);let total=list.reduce((s,x)=>s+x.area,0);list.forEach(x=>x.area*=W*H/total);let out=[],x=0,y=0,w=W,h=H,row=[];while(list.length){let side=Math.min(w,h),next=list[0];if(!row.length||worst([...row,next],side)<=worst(row,side)){row.push(list.shift());continue}const area=row.reduce((s,z)=>s+z.area,0);if(w>=h){let rw=area/h,cy=y;for(const z of row){let rh=z.area/rw;out.push({...z,x,y:cy,w:rw,h:rh});cy+=rh}x+=rw;w-=rw}else{let rh=area/w,cx=x;for(const z of row){let rw=z.area/rh;out.push({...z,x:cx,y,w:rw,h:rh});cx+=rw}y+=rh;h-=rh}row=[]}if(row.length){const area=row.reduce((s,z)=>s+z.area,0);if(w>=h){let rw=area/h,cy=y;for(const z of row){let rh=z.area/rw;out.push({...z,x,y:cy,w:rw,h:rh});cy+=rh}}else{let rh=area/w,cx=x;for(const z of row){let rw=z.area/rh;out.push({...z,x:cx,y,w:rw,h:rh});cx+=rw}}}return out}
function drawTreemap(svg,items,height,kind){const W=1000,H=height;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("preserveAspectRatio","none");const ns="http://www.w3.org/2000/svg";for(const z of squarify(items,W,H)){const g=document.createElementNS(ns,"g"),r=document.createElementNS(ns,"rect");r.setAttribute("x",z.x+.7);r.setAttribute("y",z.y+.7);r.setAttribute("width",Math.max(0,z.w-1.4));r.setAttribute("height",Math.max(0,z.h-1.4));const total=z.high+z.medium+z.low,major=z.high>=z.medium&&z.high>=z.low?"high":z.medium>=z.low?"medium":"low";r.setAttribute("fill",COLORS[major]);r.setAttribute("opacity",major==="high"?.92:major==="medium"?.82:.9);const title=document.createElementNS(ns,"title");title.textContent=`${z.name}: ${z.total} ${kind}; ${z.high} high, ${z.medium} medium, ${z.low} low confidence`;r.appendChild(title);g.appendChild(r);if(z.w>45&&z.h>20){const t=document.createElementNS(ns,"text");t.setAttribute("x",z.x+5);t.setAttribute("y",z.y+15);t.setAttribute("fill",COLORS.text);t.setAttribute("font-size",z.w<85?11:13);t.setAttribute("font-family","Arial, sans-serif");t.textContent=z.name.length>Math.max(6,z.w/7)?z.name.slice(0,Math.max(5,Math.floor(z.w/7)-1))+"…":z.name;g.appendChild(t);if(z.h>37){const c=document.createElementNS(ns,"text");c.setAttribute("x",z.x+5);c.setAttribute("y",z.y+31);c.setAttribute("fill",COLORS.text);c.setAttribute("font-size","12");c.setAttribute("font-family","Arial, sans-serif");c.textContent=fmt(z.total);g.appendChild(c)}}svg.appendChild(g)}}
function barRows(items,total){return items.map(it=>`<div class="barrow"><span>${esc(it.label)}</span><div class="bartrack"><div class="barfill ${it.kind||""}" style="width:${total?100*it.value/total:0}%"></div></div><span class="right">${fmt(it.value)}${it.suffix||""}</span></div>`).join("")}
let lastDashboardData=null;
function drawMaps(d){const info=document.getElementById("map-info");d.modules.forEach(m=>drawModule(document.getElementById(`map-${m.name}`),m,d.semanticNames,info));drawTreemap(document.getElementById("subsystem-map"),d.subsystems,300,"functions");drawTreemap(document.getElementById("structure-map"),d.structures,410,"field rows")}
function render(d){
 lastDashboardData=d;
 const app=document.getElementById("app");document.getElementById("topline").textContent=`${fmt(d.totalFunctions)} generated guest functions · ${d.modules.length} modules`;
 const statusTotal=d.semanticFunctions+d.exportOnly+d.addressOnly;
 app.innerHTML=`
  <div class="metrics">
   <div class="metric"><div class="value mono">${fmt(d.totalFunctions)}</div><div class="label">generated function wrappers · 100%</div></div>
   <div class="metric"><div class="value mono">${fmt(d.modules.find(m=>m.name==="main").semantic)} / ${fmt(d.modules.find(m=>m.name==="main").total)}</div><div class="label">main semantic names · ${percent(d.modules.find(m=>m.name==="main").semantic,d.modules.find(m=>m.name==="main").total)}%</div></div>
   <div class="metric"><div class="value mono">${fmt(d.semanticFunctions)} · ${percent(d.semanticFunctions,d.totalFunctions)}%</div><div class="label">semantic annotations · main + SDK</div></div>
   <div class="metric"><div class="value mono">${fmt(d.exportedSymbols)} · ${percent(d.exportedSymbols,d.totalFunctions)}%</div><div class="label">exact exported function symbols</div></div>
   <div class="metric"><div class="value mono">${fmt(d.prototypeCandidates)}</div><div class="label">source prototype candidates</div></div>
   <div class="metric"><div class="value mono">${fmt(d.fieldRows)} · ${fmt(d.candidateStructures)}</div><div class="label">typed fields · candidate structures</div></div>
  </div>
  <section><div class="head"><h2>Function naming and understanding</h2><span class="sub">${fmt(statusTotal)} functions indexed · one cell per function</span></div>
   <div class="module-heads">${d.modules.map(m=>`<div class="module-head"><strong>${m.name.toUpperCase()}</strong><span class="sub mono">${fmt(m.total)} functions · ${percent(m.total,d.totalFunctions)}% of build<br>${fmt(m.semantic)} semantic · ${fmt(m.exported)} exact exports</span></div>`).join("")}</div>
   <div class="modules">${d.modules.map(m=>`<canvas class="module-canvas" id="map-${m.name}" aria-label="${m.name} function naming evidence map"></canvas>`).join("")}</div>
   <div class="legend"><span><i class="key green"></i>semantic annotation</span><span><i class="key green-dark"></i>exact exported symbol</span><span><i class="key gray"></i>address-only internal</span></div>
   <div class="map-info" id="map-info" aria-live="polite">Hover the function map to inspect an indexed address and naming evidence.</div>
   <div class="barlist">${barRows([{label:"Semantic annotations",value:d.semanticFunctions},{label:"Exact symbol only",value:d.exportOnly,kind:"medium"},{label:"Address-only internal",value:d.addressOnly,kind:"medium"}],statusTotal)}</div>
  </section>
  <section class="panel"><div class="panel-head"><h2>Semantic function names by subsystem</h2><span class="sub">${fmt(d.semanticFunctions)} annotations · block area follows annotation count</span></div><svg id="subsystem-map" class="treemap" role="img" aria-label="Treemap of semantic function annotations by subsystem"></svg></section>
  <section class="panel"><div class="panel-head"><h2>Candidate structure fields</h2><span class="sub">${fmt(d.fieldRows)} field rows across ${fmt(d.candidateStructures)} candidate structures</span></div><svg id="structure-map" class="treemap structure-map" role="img" aria-label="Treemap of candidate structures sized by typed field count"></svg></section>
  <div class="lower">
   <section class="panel"><h2>Prototype candidates by confidence</h2><div class="barlist">${barRows([{label:"High confidence",value:d.prototypeConfidence.high},{label:"Medium confidence",value:d.prototypeConfidence.medium,kind:"medium"},{label:"Low confidence",value:d.prototypeConfidence.low,kind:"low"}],d.prototypeCandidates)}</div><p class="foot">Prototype candidates are ABI-level inferences, not recovered declarations.</p></section>
   <section class="panel"><h2>Evidence confidence</h2><div class="barlist">${barRows([{label:"Function names · high",value:d.annotationConfidence.high},{label:"Function names · medium",value:d.annotationConfidence.medium,kind:"medium"},{label:"Function names · low",value:d.annotationConfidence.low,kind:"low"},{label:"Field rows · high",value:d.fieldConfidence.high},{label:"Field rows · medium",value:d.fieldConfidence.medium,kind:"medium"},{label:"Field rows · low",value:d.fieldConfidence.low,kind:"low"}],Math.max(...Object.values(d.annotationConfidence),...Object.values(d.fieldConfidence)))}</div><p class="foot">A generated wrapper is not a recovered source function. Grey cells remain address-only.</p></section>
  </div>
  <section class="panel"><div class="panel-head"><h2>Annotation activity timeline</h2><div><span class="sub" id="timeline-summary">Loading activity…</span> <select id="timeline-filter" class="timeline-filter" aria-label="Filter timeline events"><option value="all">All changes</option><option value="Function">Functions</option><option value="Function annotation">Function annotations</option><option value="Prototype">Prototypes</option><option value="Field / type">Fields and types</option></select></div></div><div id="timeline-feed" class="timeline" aria-live="polite"><div class="timeline-empty">Loading timestamped entries…</div></div><p class="foot">New and changed function, prototype, and field rows are timestamped when detected. Existing rows are the baseline and have no invented timestamps.</p></section>
  <div class="foot">Static call and memory behavior rows indexed: ${fmt(d.behaviorIndexRows)} · ${fmt(d.demangledSymbols)} demangled C++ function names · reload the page after annotation files change.</div>`;
 drawMaps(d);
}
let resizeTimer;
window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>lastDashboardData&&drawMaps(lastDashboardData),120)});
let timelineData=null,coverageVersion=null,timelineVersion=null;
function renderTimeline(data){timelineData=data;const feed=document.getElementById("timeline-feed"),summary=document.getElementById("timeline-summary"),filter=document.getElementById("timeline-filter");if(!feed||!summary||!filter)return;const selected=filter.value,events=data.events.filter(e=>selected==="all"||e.kind===selected);summary.textContent=`${fmt(data.totalEvents)} events · tracking since ${new Date(data.trackingSince).toLocaleString()}`;if(!events.length){feed.innerHTML='<div class="timeline-empty">No entries in this filter yet.</div>';return}feed.innerHTML=events.map(e=>{const local=new Date(e.timestamp).toLocaleString();const meta=[e.module,e.address].filter(Boolean).join(" · ");return `<article class="timeline-row"><time class="timeline-time" datetime="${esc(e.timestamp)}" title="${esc(e.timestamp)}">${esc(local)}</time><div><div class="timeline-title"><span class="timeline-action">${esc(e.action)}</span><span class="timeline-kind">${esc(e.kind)}</span><strong>${esc(e.item)}</strong></div><div class="timeline-details" title="${esc(e.details)}">${esc(e.details)}</div>${meta?`<div class="timeline-meta">${esc(meta)}</div>`:""}</div></article>`}).join("")}
async function fetchDashboardJson(apiPath,staticPath){try{const api=await fetch(apiPath,{cache:"no-store"});if(api.ok)return await api.json()}catch{}const fallback=await fetch(new URL(staticPath,document.baseURI),{cache:"no-store"});if(!fallback.ok)throw new Error(`HTTP ${fallback.status} loading ${staticPath}`);return await fallback.json()}
async function loadTimeline(){try{const data=await fetchDashboardJson("/api/timeline","./data/timeline.json");if(data.version===timelineVersion)return;timelineVersion=data.version;renderTimeline(data)}catch(e){const feed=document.getElementById("timeline-feed");if(feed)feed.innerHTML=`<div class="timeline-empty">Could not load timeline: ${esc(e.message)}</div>`}}
async function loadDashboard(){try{const status=await fetchDashboardJson("/api/coverage-status","./data/coverage-status.json");if(status.sourceVersion===coverageVersion)return;const data=await fetchDashboardJson("/api/coverage","./data/coverage.json");coverageVersion=data.sourceVersion;render(data);await loadTimeline();document.getElementById("timeline-filter").addEventListener("change",()=>timelineData&&renderTimeline(timelineData))}catch(e){document.getElementById("app").innerHTML=`<div class="error">Could not load the recomp indexes: ${esc(e.message)}</div>`}}
loadDashboard();setInterval(loadDashboard,15000);setInterval(loadTimeline,5000);
</script>
</body>
</html>
